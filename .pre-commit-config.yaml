# Local system hooks never download hook environments.
# Activate the Python 3.12+ project venv and install gitleaks locally first.
repos:
  - repo: local
    hooks:
      - id: gitleaks-staged
        name: gitleaks (staged index, redacted output)
        entry: python tools/scan_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: readonly-boundary
        name: research-only production boundary
        entry: python -m pytest tests/test_readonly.py --basetemp=.test-tmp -q
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: python -m ruff format --check
        language: system
        types: [python]

[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpsilab-research-adapter"
version = "0.0.1"
description = "Offline scaffold for a standalone research-only HPSILab CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.15,<1",
    "pre-commit>=4,<5",
]

[project.scripts]
hpsilab = "hpsilab_research_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "sdk_contract: blocked until Faisal supplies the SDK and agreed test binding",
    "schema_pending: requires documented provider response structures",
    "secret_scanner: requires a locally installed gitleaks binary",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".wheelhouse", ".test-tmp", ".reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

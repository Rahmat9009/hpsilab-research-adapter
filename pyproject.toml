[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpsilab-research-adapter"
version = "0.1.0"
description = "Read-only research adapter for six HPSILab tools (independent, unverified third-party integration; not an official HPSILab product)"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
# Plain hpsilab-mcp only. Never the [x402] extra: it pays per call in USDC.
dependencies = [
    "hpsilab-mcp==0.14.2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.15,<1",
    "pre-commit>=4,<5",
]

[project.scripts]
hpsilab-research = "hpsilab_research_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "sdk_contract: blocked until Faisal supplies the SDK and agreed test binding",
    "schema_pending: requires documented provider response structures",
    "secret_scanner: requires a locally installed gitleaks binary",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".wheelhouse", ".test-tmp", ".reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
